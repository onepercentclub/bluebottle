{% extends 'base.html' %}
{% load static %}
{% load i18n %}

{% block content %}
    <p>{% trans "Redirecting..." %}</p>
{% endblock %}

{% block script %}

    <script>
        var token = "{{ token|escapejs }}";
        var originalToken = "{{ original_token|default:''|escapejs }}";
        var link = "{{ link|escapejs }}";

        function storeToken(token, originalToken) {
            // Create fallback for localStorage
            var authStorage;
            try {
                localStorage.setItem('testLocalStorage', 'testLocalStorage');
                localStorage.removeItem('testLocalStorage');
                authStorage = localStorage;
            } catch (ex) {
                authStorage = {
                    _data: {},
                    setItem: function (id, val) {
                        try {
                            return setCookie(id, value, 100);
                        } catch (ex) {
                            return (this._data[id] = String(val));
                        }
                    }
                };
            }
            if (originalToken) {
                authStorage['originalJwtToken'] = originalToken;
            }
            authStorage['jwtToken'] = token;
        }
        storeToken(token, originalToken);
        // Redirect to deep link
        location.href = link;

    </script>

{% endblock %}
